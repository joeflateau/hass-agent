name: Home Assistant Media

on:
  push:
    branches: [main]
    paths: ['custom_components/**', 'tests/ha_media/**', '.github/workflows/ha-media.yml']
  pull_request:
    paths: ['custom_components/**', 'tests/ha_media/**', '.github/workflows/ha-media.yml']

permissions:
  contents: read

jobs:
  ha-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: tests/ha_media/requirements.txt
      - run: python -m pip install -r tests/ha_media/requirements.txt
      - run: python -m pytest -c tests/ha_media/pytest.ini tests/ha_media
