name: Build and Test

env:
  NODE_VERSION: 26.7.0

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build signed macOS Node SEAs
        run: scripts/build-macos-sea.sh

      - name: Verify executable
        run: |
          echo "=== Universal Binary ==="
          ls -la hass-agent
          file hass-agent
          lipo -info hass-agent
          codesign --verify --strict --verbose=2 hass-agent
          echo ""
          echo "=== ARM64 Binary ==="
          ls -la hass-agent-arm64
          file hass-agent-arm64
          codesign --verify --strict --verbose=2 hass-agent-arm64
          echo ""
          echo "=== x64 Binary ==="
          ls -la hass-agent-x64
          file hass-agent-x64
          codesign --verify --strict --verbose=2 hass-agent-x64

      - name: Smoke test universal executable
        run: |
          ./hass-agent --help
          ./hass-agent media-runtime-check

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: hass-agent-builds-${{ github.sha }}
          path: |
            hass-agent
            hass-agent-arm64
            hass-agent-x64
          retention-days: 7
